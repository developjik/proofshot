name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck, unit, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit + end-to-end tests
        run: npm test

      - name: CLI smoke test on the demo fixtures
        run: >-
          node dist/bin/cli.js compare
          --base demo/before
          --head demo/after
          --routes /,/pricing
          --viewports desktop
          --out proofshot-out

      - name: Upload demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofshot-demo-report
          path: proofshot-out
          retention-days: 7
