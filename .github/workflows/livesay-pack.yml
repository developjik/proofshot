name: Visual and announcement evidence sample
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: proofshot
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: developjik/livesay
          ref: 3cf310a667fff3047114fad12324300616b64045
          path: livesay
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.12.0'
      - run: npm ci && npm run build
        working-directory: livesay
      - run: npm ci && npm run build
        working-directory: proofshot
      - run: npx playwright install --with-deps chromium
        working-directory: proofshot
      - name: Same-page synthetic sample
        working-directory: proofshot
        run: node examples/livesay-pack/sample.mjs ../livesay/dist/index.js livesay-pack-out
      - name: Negative binding and collection checks
        working-directory: proofshot
        run: node examples/livesay-pack/test.mjs ../livesay/dist/index.js livesay-pack-out/rerun-config.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: visual-announcement-evidence
          path: proofshot/livesay-pack-out
          retention-days: 7
