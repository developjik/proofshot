<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local evidence fixture</title><style>body{font:18px system-ui;margin:40px;max-width:760px;color:#132839;background:#f7fafc}button{font:inherit;padding:12px 20px;background:#135e69;color:white;border:0;border-radius:8px}section{margin-top:24px;padding:24px;border:1px solid #b9cdd6;border-radius:12px;background:white}p{line-height:1.6}</style><h1>Answer review</h1><p>Synthetic local fixture. Open the result to compare the scene and announcement record.</p><button id="open">Open result</button><section id="result" hidden><h2>Result ready</h2><p id="answer" role="status" aria-live="polite" aria-atomic="true"></p></section><script>
const openButton = document.querySelector('#open');
openButton.onclick = () => {
  document.querySelector('#result').hidden = false;
  const probe = window.__livesayProbe;
  probe?.mark('start', {id:'answer-1'});
  setTimeout(() => {
    document.querySelector('#answer').textContent = 'Your report is ready. Completed.';
    probe?.mark('done', {id:'answer-1'});
  }, 120);
};
</script></html>
